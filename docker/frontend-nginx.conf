# Minimal SPA nginx config: serve static assets, fall back to
# index.html for client-side routing (react-router-dom), and proxy
# /v1 to the api container so the frontend can call the API without
# CORS in a docker-compose deployment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
